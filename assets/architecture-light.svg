<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">V3DANT-lab secure AI product architecture</title>
  <desc id="desc">A responsive browser and frontend connect to Netlify Functions, which securely communicates with AI services and the Supabase PostgreSQL data layer. GitHub OAuth and Netlify or Vercel deployment are shown as supporting services.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 36px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .node-title { font: 700 25px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .node-detail { font: 400 20px Arial, Helvetica, sans-serif; fill: #334155; }
      .edge-label { font: 600 18px Arial, Helvetica, sans-serif; fill: #334155; }
      .node { stroke-width: 3; rx: 18; }
      .edge { fill: none; stroke: #64748b; stroke-width: 4; marker-end: url(#arrow); }
      .dashed-edge { fill: none; stroke: #7c3aed; stroke-width: 4; stroke-dasharray: 12 10; marker-end: url(#arrow-dashed); }
    </style>
  </defs>

  <rect width="1600" height="760" fill="#ffffff"/>
  <text x="800" y="55" text-anchor="middle" class="title">V3DANT-lab · Secure AI Product Architecture</text>

  <path class="edge" d="M 270 190 C 290 190 295 190 320 190"/>
  <path class="edge" d="M 560 190 C 585 190 590 190 620 190"/>
  <path class="edge" d="M 900 175 C 955 145 980 140 1030 140"/>
  <path class="edge" d="M 900 220 C 955 265 980 285 1030 285"/>
  <path class="dashed-edge" d="M 150 270 C 180 365 245 390 320 410"/>
  <path class="dashed-edge" d="M 560 430 C 620 380 650 290 700 250"/>
  <path class="dashed-edge" d="M 435 270 C 500 335 585 390 650 410"/>

  <text x="292" y="170" text-anchor="middle" class="edge-label">HTTPS</text>
  <text x="590" y="170" text-anchor="middle" class="edge-label">API calls</text>
  <text x="968" y="115" text-anchor="middle" class="edge-label">Secure request</text>
  <text x="970" y="275" text-anchor="middle" class="edge-label">Read / write</text>
  <text x="188" y="350" text-anchor="middle" class="edge-label">OAuth</text>
  <text x="614" y="335" text-anchor="middle" class="edge-label">OAuth callback</text>
  <text x="545" y="370" text-anchor="middle" class="edge-label">Deploy</text>

  <rect class="node" x="30" y="120" width="240" height="150" fill="#eaf2ff" stroke="#1d4ed8"/>
  <text x="150" y="175" text-anchor="middle" class="node-title">User / Browser</text>
  <text x="150" y="215" text-anchor="middle" class="node-detail">Responsive UI</text>

  <rect class="node" x="320" y="120" width="240" height="150" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="440" y="175" text-anchor="middle" class="node-title">React + Vite</text>
  <text x="440" y="215" text-anchor="middle" class="node-detail">Tailwind CSS</text>

  <rect class="node" x="620" y="120" width="280" height="150" fill="#ecfdf5" stroke="#059669"/>
  <text x="760" y="170" text-anchor="middle" class="node-title">Netlify Functions</text>
  <text x="760" y="210" text-anchor="middle" class="node-detail">Server-side API boundary</text>

  <rect class="node" x="1030" y="65" width="300" height="150" fill="#fff7ed" stroke="#ea580c"/>
  <text x="1180" y="120" text-anchor="middle" class="node-title">AI Services</text>
  <text x="1180" y="160" text-anchor="middle" class="node-detail">Groq · Pollinations.AI</text>

  <rect class="node" x="1030" y="250" width="300" height="150" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="1180" y="305" text-anchor="middle" class="node-title">Data Layer</text>
  <text x="1180" y="345" text-anchor="middle" class="node-detail">Supabase · PostgreSQL</text>

  <rect class="node" x="320" y="390" width="240" height="150" fill="#f5f3ff" stroke="#7c3aed"/>
  <text x="440" y="445" text-anchor="middle" class="node-title">GitHub OAuth</text>
  <text x="440" y="485" text-anchor="middle" class="node-detail">CSRF-protected flow</text>

  <rect class="node" x="650" y="390" width="270" height="150" fill="#f8fafc" stroke="#475569"/>
  <text x="785" y="445" text-anchor="middle" class="node-title">Deployment</text>
  <text x="785" y="485" text-anchor="middle" class="node-detail">Netlify · Vercel</text>
</svg>
