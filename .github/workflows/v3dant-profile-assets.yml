name: Generate V3DANT-lab profile assets

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate dark contribution asset
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEME: dark
          OUTPUT_PATH: dist/v3dant-contribution-dark.svg
        run: node generate.mjs

      - name: Generate light contribution asset
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEME: light
          OUTPUT_PATH: dist/v3dant-contribution-light.svg
        run: node generate.mjs

      - name: Validate generated SVGs
        run: node preview-test.mjs dist/v3dant-contribution-dark.svg dist/v3dant-contribution-light.svg

      - name: Commit generated assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update V3DANT-lab profile assets"
          file_pattern: dist/v3dant-contribution-dark.svg dist/v3dant-contribution-light.svg
