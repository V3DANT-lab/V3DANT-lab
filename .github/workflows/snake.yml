name: Generate contribution snake

on:
  # Regenerate the animation once per day.
  schedule:
    - cron: "0 0 * * *"

  # Allow manual runs from the Actions tab.
  workflow_dispatch:

  # Refresh the snake whenever the main profile repository changes.
  push:
    branches:
      - main

# The workflow publishes generated SVG files to the output branch.
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate light and dark contribution snakes
        uses: Platane/snk@v3
        with:
          github_user_name: V3DANT-lab
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
